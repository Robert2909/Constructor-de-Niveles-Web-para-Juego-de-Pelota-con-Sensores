<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LevelBuilder Web | Juego de Pelota</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/rulers.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div id="app">
        <header>
            <div class="logo">
                <h1>LEVEL<span>BUILDER</span></h1>
                <div class="level-id-container">
                    <span>Nivel</span>
                    <input type="number" id="levelIdInput" value="1" min="1">
                </div>
            </div>
            <!-- NUEVA BARRA DE HERRAMIENTAS CENTRAL -->
            <div class="top-toolbar">
                <!-- VISTA -->
                <div class="toolbar-group">
                    <div class="zoom-control-group compact">
                        <button id="zoomOut" class="mode-btn small-btn" title="Alejar"><span>−</span></button>
                        <button id="resetZoom" class="mode-btn active" title="Restablecer 1:1"><span
                                id="zoomLabel">100%</span></button>
                        <button id="zoomIn" class="mode-btn small-btn" title="Acercar"><span>+</span></button>
                    </div>
                    <span class="toolbar-tag">VISTA</span>
                </div>

                <div class="toolbar-divider"></div>

                <!-- HERRAMIENTAS -->
                <div class="toolbar-group">
                    <div class="mode-toggle-group compact">
                        <button id="modeBlock" class="mode-btn active" data-mode="block" title="Modo Bloques">
                            <div class="icon-small block"></div>
                        </button>
                        <button id="modeBrush" class="mode-btn" data-mode="brush" title="Modo Pincel">
                            <div class="icon-small brush"></div>
                        </button>
                    </div>
                    <span class="toolbar-tag">HERRAMIENTAS</span>
                </div>

                <div class="toolbar-divider"></div>

                <!-- REJILLA -->
                <div class="toolbar-group">
                    <div class="mode-toggle-group compact">
                        <button id="snapOn" class="mode-btn active" data-action="snap" title="Magnetismo Activado">
                            <div class="icon-small snap-on"></div>
                        </button>
                        <button id="snapOff" class="mode-btn" data-action="snap" title="Movimiento Libre">
                            <div class="icon-small snap-off"></div>
                        </button>
                    </div>
                    <span class="toolbar-tag">SNAP</span>
                </div>

                <div class="toolbar-divider"></div>

                <!-- DENSIDAD -->
                <div class="toolbar-group">
                    <div class="grid-density-toolbar">
                        <input type="number" id="gridCols" value="96" min="10" max="200" class="styled-input minimal">
                        <span class="toolbar-label">×</span>
                        <input type="number" id="gridRows" value="54" min="10" max="200" class="styled-input minimal">
                    </div>
                    <span class="toolbar-tag">REJILLA</span>
                </div>
            </div>

            <div class="top-actions">
                <button id="btnOpenImport" class="btn-secondary">IMPORTAR</button>
                <button id="btnExport" class="btn-primary">EXPORTAR JSON</button>
            </div>
        </header>

        <main>
            <aside class="sidebar left">
                <div class="sidebar-header">
                    <h2>ENTIDADES</h2>
                </div>
                <div class="tool-section scrollable">
                    <div class="tool-grid" id="entityGrid">
                        <!-- Botones de entidades (generados dinámicamente o estáticos pero escalables) -->
                        <button class="tool-btn active" data-type="wall" title="Muro (Bloque sólido)" draggable="true">
                            <div class="icon wall"></div>
                            <span>Muro</span>
                        </button>
                        <button class="tool-btn" data-type="hazard" title="Lava (Mortal)" draggable="true">
                            <div class="icon hazard"></div>
                            <span>Lava</span>
                        </button>
                        <button class="tool-btn" data-type="start" title="Punto de Inicio" draggable="true">
                            <div class="icon start"></div>
                            <span>Inicio</span>
                        </button>
                        <button class="tool-btn" data-type="goal" title="Meta" draggable="true">
                            <div class="icon goal"></div>
                            <span>Meta</span>
                        </button>
                        <button id="btnPerimeter" class="tool-btn" title="Generar Perímetro Mortal">
                            <div class="icon perimeter"></div>
                            <span>Perímetro</span>
                        </button>
                    </div>
                </div>

                <div class="sidebar-header" style="border-top: 1px solid var(--border);">
                    <h2>PROPIEDADES</h2>
                </div>
                <div id="propertiesPanel" class="tool-section" style="border-bottom: none; overflow-y: auto;">
                    <div id="selection-controls">
                        <div class="control-group">
                            <label>Tipo</label>
                            <span id="propType" class="prop-val">---</span>
                        </div>
                        <div class="control-row" style="margin-top: 10px;">
                            <div class="control-group">
                                <label>X</label>
                                <input type="text" id="propX" class="styled-input" value="---" disabled>
                            </div>
                            <div class="control-group">
                                <label>Y</label>
                                <input type="text" id="propY" class="styled-input" value="---" disabled>
                            </div>
                        </div>
                        <div class="control-row">
                            <div class="control-group">
                                <label>Ancho</label>
                                <input type="text" id="propW" class="styled-input" value="---" disabled>
                            </div>
                            <div class="control-group">
                                <label>Alto</label>
                                <input type="text" id="propH" class="styled-input" value="---" disabled>
                            </div>
                        </div>
                        <!-- Contenedor para propiedades específicas de entidades futuras -->
                        <div id="extra-properties"></div>

                        <button id="btnDelete" class="btn-delete" disabled>ELIMINAR OBJETO</button>
                    </div>
                </div>
            </aside>

            <main id="canvas-container" class="canvas-container">
                <!-- Reglas Métricas -->
                <div id="ruler-corner"></div>
                <div id="ruler-h-container">
                    <canvas id="rulerH" class="ruler-canvas"></canvas>
                </div>
                <div id="ruler-v-container">
                    <canvas id="rulerV" class="ruler-canvas"></canvas>
                </div>

                <div class="canvas-area">
                    <canvas id="editorCanvas"></canvas>
                    <div id="status-bar">
                        <div id="coordInfo">X: 0, Y: 0</div>
                        <div id="selectionStats" class="hidden">
                            <span class="divider">|</span>
                            <span id="statW">Ancho: 0 celdas</span>
                            <span class="divider">|</span>
                            <span id="statH">Alto: 0 celdas</span>
                        </div>
                    </div>
                </div>
            </main>

            <aside class="sidebar right">


                <div class="sidebar-header">
                    <h2>TRANSFORMACIONES</h2>
                </div>
                <div class="tool-section">
                    <div id="transform-panel" class="disabled-ui">
                        <div class="control-group-vertical">
                            <label>Ordenamiento</label>
                            <div class="mode-toggle-group" style="margin-top: 5px;">
                                <button id="bringToFront" class="mode-btn" title="Traer al Frente">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 14V6a2 2 0 0 1 2-2h8"/></svg>
                                    <span>Al frente</span>
                                </button>
                                <button id="sendToBack" class="mode-btn" title="Enviar al Fondo">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><rect x="3" y="3" width="13" height="13" rx="2"/><path d="M16 10h2a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2v-2"/></svg>
                                    <span>Al fondo</span>
                                </button>
                            </div>
                        </div>

                        <div class="control-group-vertical">
                            <label>Invertir</label>
                            <div class="mode-toggle-group" style="margin-top: 5px;">
                                <button id="mirrorH" class="mode-btn" title="Espejo Horizontal">
                                    <div class="icon-small mirror-h"></div>
                                    <span>Horizontal</span>
                                </button>
                                <button id="mirrorV" class="mode-btn" title="Espejo Vertical">
                                    <div class="icon-small mirror-v"></div>
                                    <span>Vertical</span>
                                </button>
                            </div>
                        </div>

                        <div class="control-group-vertical">
                            <label>Rotar</label>
                            <div class="mode-toggle-group" style="margin-top: 5px;">
                                <button id="rotateL" class="mode-btn" title="Rotar 90° Izquierda">
                                    <div class="icon-small rotate-l"></div>
                                    <span>-90°</span>
                                </button>
                                <button id="rotateR" class="mode-btn" title="Rotar 90° Derecha">
                                    <div class="icon-small rotate-r"></div>
                                    <span>+90°</span>
                                </button>
                            </div>
                        </div>

                        <div class="control-group-vertical" style="margin-bottom: 0;">
                            <label>Escalar</label>
                            <div class="control-row" style="margin-top: 5px;">
                                <div class="control-group">
                                    <label>Ancho</label>
                                    <input type="text" id="targetScaleW" class="styled-input" value="---" disabled>
                                </div>
                                <div class="control-group">
                                    <label>Alto</label>
                                    <input type="text" id="targetScaleH" class="styled-input" value="---" disabled>
                                </div>
                            </div>
                            <button id="btnApplyScale" class="btn-small secondary-action"
                                style="margin-top: 5px;">APLICAR ESCALA</button>
                        </div>
                    </div>
                </div>

                <div class="sidebar-header" style="border-top: 1px solid var(--border);">
                    <h2>JSON RESULTANTE</h2>
                </div>
                <div class="tool-section json-section">
                    <textarea id="jsonOutput" readonly placeholder="El JSON aparecerá aquí..."></textarea>
                    <button id="btnCopy" class="btn-small">COPIAR</button>
                </div>
            </aside>
        </main>
    </div>

    <!-- Modal para importar -->
    <div id="modalImport" class="modal hidden">
        <div class="modal-content">
            <h2>Importar Nivel</h2>
            <p>Pega el JSON del nivel aquí:</p>
            <textarea id="txtImportJson"></textarea>
            <div class="modal-actions">
                <button id="btnDoImport" class="btn-primary">CARGAR</button>
                <button id="btnCloseModal" class="btn-secondary">CANCELAR</button>
            </div>
        </div>
    </div>

    <script type="module" src="editor.js"></script>
</body>

</html>
