<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LevelBuilder Web | Juego de Pelota</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/rulers.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div id="app">
        <header>
            <div class="logo">
                <h1>LEVEL<span>BUILDER</span></h1>
                <div class="level-id-container">
                    <span>Nivel</span>
                    <input type="number" id="levelIdInput" value="1" min="1">
                </div>
                <div class="level-id-container" style="margin-left: 15px;">
                    <span>Tema</span>
                    <select id="themeInput"
                        style="height: 32px; background: #1e1e1e; color: #ffffff; border: 1px solid #2a2a2a; border-radius: 4px; padding: 0 8px; cursor: pointer; font-family: inherit; font-size: 13px; outline: none;">
                        <option value="industrial">Industrial</option>
                        <option value="volcano">Volcán</option>
                        <option value="neon">Neón</option>
                        <option value="forest">Bosque</option>
                        <option value="inferno">Infierno</option>
                    </select>
                </div>
                <div class="level-id-container" style="margin-left: 15px;">
                    <span>Dimensiones</span>
                    <input type="number" id="levelWidthInput" value="1920" min="800" max="10000"
                        style="width: 70px; height: 32px; background: #1e1e1e; color: #ffffff; border: 1px solid #2a2a2a; border-radius: 4px; padding: 0 8px; font-family: inherit; font-size: 13px; outline: none; text-align: center;">
                    <span style="color: rgba(255,255,255,0.4); margin: 0 4px;">×</span>
                    <input type="number" id="levelHeightInput" value="1080" min="600" max="10000"
                        style="width: 70px; height: 32px; background: #1e1e1e; color: #ffffff; border: 1px solid #2a2a2a; border-radius: 4px; padding: 0 8px; font-family: inherit; font-size: 13px; outline: none; text-align: center;">
                    <select id="presetDimensions"
                        style="margin-left: 8px; height: 32px; background: #1e1e1e; color: #ffffff; border: 1px solid #2a2a2a; border-radius: 4px; padding: 0 8px; cursor: pointer; font-family: inherit; font-size: 13px; outline: none;">
                        <option value="" disabled selected hidden>Presets</option>
                        <option value="1920x1080">FHD (1920x1080)</option>
                        <option value="3840x2160">4K (3840x2160)</option>
                        <option value="3840x1080">Pasillo Largo (3840x1080)</option>
                        <option value="1920x3240">Torre Alta (1920x3240)</option>
                        <option value="1080x1920">Vertical (1080x1920)</option>
                    </select>
                </div>
            </div>

            <div class="top-actions">
                <button id="btnClear" class="btn-secondary"
                    style="gap: 6px; display: inline-flex; align-items: center; color: #ff6b6b; border-color: rgba(255,107,107,0.3);">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    LIMPIAR
                </button>
                <button id="btnSave" class="btn-secondary"
                    style="gap: 6px; display: inline-flex; align-items: center;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
                        <polyline points="7 3 7 8 15 8"></polyline>
                    </svg>
                    GUARDAR
                </button>
                <button id="btnOpenImport" class="btn-secondary"
                    style="gap: 6px; display: inline-flex; align-items: center;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="7 10 12 15 17 10" />
                        <line x1="12" y1="15" x2="12" y2="3" />
                    </svg>
                    IMPORTAR
                </button>
                <button id="btnCopyJSON" class="btn-secondary"
                    style="gap: 6px; display: inline-flex; align-items: center;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                    </svg>
                    COPIAR JSON
                </button>
                <button id="btnExport" class="btn-primary" style="gap: 6px; display: inline-flex; align-items: center;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="17 8 12 3 7 8" />
                        <line x1="12" y1="3" x2="12" y2="15" />
                    </svg>
                    EXPORTAR JSON
                </button>
            </div>
        </header>

        <main>
            <aside class="sidebar left">
                <div class="sidebar-header">
                    <h2>ENTIDADES</h2>
                </div>
                <div class="tool-section scrollable">
                    <div class="tool-grid" id="entityGrid">
                        <!-- Botones de entidades (generados dinámicamente o estáticos pero escalables) -->
                        <!-- 1. JUGABILIDAD Y PUNTOS DE CONTROL -->
                        <button class="tool-btn" data-type="start" title="Punto de Inicio" draggable="true">
                            <div class="icon start"></div>
                            <span>Inicio</span>
                        </button>
                        <button class="tool-btn" data-type="goal" title="Meta" draggable="true">
                            <div class="icon goal"></div>
                            <span>Meta</span>
                        </button>
                        <button class="tool-btn" data-type="checkpoint" title="Checkpoint (Punto de control)"
                            draggable="true">
                            <div class="icon checkpoint"></div>
                            <span>Checkpoint</span>
                        </button>

                        <!-- 2. BLOQUES ESTÁTICOS Y FÍSICOS -->
                        <button class="tool-btn active" data-type="wall" title="Muro (Bloque sólido)" draggable="true">
                            <div class="icon wall"></div>
                            <span>Muro</span>
                        </button>
                        <button class="tool-btn" data-type="box" title="Caja Móvil (Física de empuje)" draggable="true">
                            <div class="icon box"></div>
                            <span>Caja Móvil</span>
                        </button>
                        <button class="tool-btn" data-type="hazard" title="Lava (Mortal)" draggable="true">
                            <div class="icon hazard"></div>
                            <span>Lava</span>
                        </button>

                        <!-- 3. ACTIVADORES Y CIRCUITOS LÓGICOS -->
                        <button class="tool-btn" data-type="switch" title="Interruptor (Presionable)" draggable="true">
                            <div class="icon switch"></div>
                            <span>Interruptor</span>
                        </button>
                        <button class="tool-btn" data-type="gate" title="Compuerta (Activable)" draggable="true">
                            <div class="icon gate"></div>
                            <span>Compuerta</span>
                        </button>
                        <button class="tool-btn" data-type="logic_gate" title="Compuerta Lógica (AND, OR, NOT)"
                            draggable="true">
                            <div class="icon logic_gate"></div>
                            <span>Lógica</span>
                        </button>
                        <button class="tool-btn" data-type="timer" title="Temporizador (Activable)"
                            draggable="true">
                            <div class="icon timer"></div>
                            <span>Temporizador</span>
                        </button>

                        <!-- 4. ELEMENTOS MÓVILES Y PELIGROS DINÁMICOS -->
                        <button class="tool-btn" data-type="moving_wall" title="Muro Móvil (Movimiento lineal)"
                            draggable="true">
                            <div class="icon moving_wall"></div>
                            <span>Muro Móvil</span>
                        </button>
                        <button class="tool-btn" data-type="moving_hazard" title="Lava Móvil (Peligro oscilante)"
                            draggable="true">
                            <div class="icon moving_hazard"></div>
                            <span>Lava Móvil</span>
                        </button>
                        <button class="tool-btn" data-type="spinning_hazard" title="Sierra (Peligro giratorio)"
                            draggable="true">
                            <div class="icon spinning_hazard"></div>
                            <span>Sierra</span>
                        </button>

                        <!-- 5. ELEMENTOS DE AREA Y MECANICAS -->
                        <button class="tool-btn" data-type="wind_zone" title="Zona de Viento (Fuerza constante)"
                            draggable="true">
                            <div class="icon wind_zone"></div>
                            <span>Zona Viento</span>
                        </button>
                        <button class="tool-btn" data-type="speed_pad" title="Acelerador (Speed Pad)" draggable="true">
                            <div class="icon speed_pad"></div>
                            <span>Acelerador</span>
                        </button>
                        <button class="tool-btn" data-type="boss" title="Jefe Arena (Boss)" draggable="true">
                            <div class="icon boss"></div>
                            <span>Jefe/Boss</span>
                        </button>
                        <button class="tool-btn" data-type="portal" title="Portal (Teletransportación)" draggable="true">
                            <div class="icon portal"></div>
                            <span>Portal</span>
                        </button>

                        <!-- 6. HERRAMIENTAS RÁPIDAS -->
                        <button id="btnPerimeter" class="tool-btn" title="Generar Perímetro Mortal">
                            <div class="icon perimeter"></div>
                            <span>Perímetro</span>
                        </button>
                    </div>
                </div>

                <div class="sidebar-header" style="border-top: 1px solid var(--border);">
                    <h2>PROPIEDADES</h2>
                </div>
                <div id="propertiesPanel" class="tool-section scrollable" style="border-bottom: none;">
                    <div id="selection-controls">
                        <div class="control-group">
                            <label>Tipo</label>
                            <span id="propType" class="prop-val">---</span>
                        </div>
                        <div class="control-row" style="margin-top: 10px;">
                            <div class="control-group">
                                <label>X</label>
                                <input type="text" id="propX" class="styled-input" value="---" disabled>
                            </div>
                            <div class="control-group">
                                <label>Y</label>
                                <input type="text" id="propY" class="styled-input" value="---" disabled>
                            </div>
                        </div>
                        <div class="control-row">
                            <div class="control-group">
                                <label>Ancho</label>
                                <input type="text" id="propW" class="styled-input" value="---" disabled>
                            </div>
                            <div class="control-group">
                                <label>Alto</label>
                                <input type="text" id="propH" class="styled-input" value="---" disabled>
                            </div>
                        </div>
                        <!-- Contenedor para propiedades específicas de entidades futuras -->
                        <div id="extra-properties"></div>

                        <button id="btnDelete" class="btn-delete" disabled>ELIMINAR OBJETO</button>
                    </div>
                </div>
            </aside>

            <main id="canvas-container" class="canvas-container">
                <!-- Reglas Métricas -->
                <div id="ruler-corner"></div>
                <div id="ruler-h-container">
                    <canvas id="rulerH" class="ruler-canvas"></canvas>
                </div>
                <div id="ruler-v-container">
                    <canvas id="rulerV" class="ruler-canvas"></canvas>
                </div>

                <div class="canvas-area">
                    <!-- NUEVA BARRA DE HERRAMIENTAS CENTRAL -->
                    <div class="top-toolbar">
                        <!-- VISTA -->
                        <div class="toolbar-group">
                            <div class="zoom-control-group compact">
                                <button id="zoomOut" class="mode-btn small-btn" title="Alejar"><span>−</span></button>
                                <button id="resetZoom" class="mode-btn active" title="Restablecer 1:1"><span
                                        id="zoomLabel">100%</span></button>
                                <button id="zoomIn" class="mode-btn small-btn" title="Acercar"><span>+</span></button>
                            </div>
                            <span class="toolbar-tag">VISTA</span>
                        </div>

                        <div class="toolbar-divider"></div>

                        <!-- HERRAMIENTAS -->
                        <div class="toolbar-group">
                            <div class="mode-toggle-group compact">
                                <button id="modeBlock" class="mode-btn active" data-mode="block" title="Modo Bloques">
                                    <div class="icon-small block"></div>
                                </button>
                                <button id="modeBrush" class="mode-btn" data-mode="brush" title="Modo Pincel">
                                    <div class="icon-small brush"></div>
                                </button>
                            </div>
                            <span class="toolbar-tag">HERRAMIENTAS</span>
                        </div>

                        <div class="toolbar-divider"></div>

                        <!-- REJILLA -->
                        <div class="toolbar-group">
                            <div class="mode-toggle-group compact">
                                <button id="snapOn" class="mode-btn active" data-action="snap" title="Magnetismo Activado">
                                    <div class="icon-small snap-on"></div>
                                </button>
                                <button id="snapOff" class="mode-btn" data-action="snap" title="Movimiento Libre">
                                    <div class="icon-small snap-off"></div>
                                </button>
                            </div>
                            <span class="toolbar-tag">SNAP</span>
                        </div>

                        <div class="toolbar-divider"></div>

                        <!-- DENSIDAD -->
                        <div class="toolbar-group">
                            <div class="grid-density-toolbar">
                                <input type="number" id="gridCols" value="96" min="10" max="200" class="styled-input minimal">
                                <span class="toolbar-label">×</span>
                                <input type="number" id="gridRows" value="54" min="10" max="200" class="styled-input minimal">
                                <select id="presetGrids"
                                    style="margin-left: 5px; height: 32px; background: #1e1e1e; color: #ffffff; border: 1px solid #2a2a2a; border-radius: 4px; padding: 0 8px; cursor: pointer; font-family: inherit; font-size: 13px; outline: none;">
                                    <option value="" disabled selected hidden>Bloques</option>
                                    <option value="20">20px (Fino)</option>
                                    <option value="40">40px (Estándar)</option>
                                    <option value="60">60px (Grande)</option>
                                    <option value="120">120px (Gigante)</option>
                                </select>
                            </div>
                            <span class="toolbar-tag">REJILLA</span>
                        </div>
                    </div>
                    <canvas id="editorCanvas"></canvas>
                    <div id="status-bar">
                        <div id="coordInfo">X: 0, Y: 0</div>
                        <div id="selectionStats" class="hidden">
                            <span class="divider">|</span>
                            <span id="statW">Ancho: 0 celdas</span>
                            <span class="divider">|</span>
                            <span id="statH">Alto: 0 celdas</span>
                        </div>
                    </div>
                </div>
            </main>

            <aside class="sidebar right">


                <div class="sidebar-header">
                    <h2>TRANSFORMACIONES</h2>
                </div>
                <div class="tool-section scrollable" style="flex: 1; min-height: 0;">
                    <div id="transform-panel" class="disabled-ui">
                        <div class="control-group-vertical">
                            <label>Ordenamiento</label>
                            <div class="mode-toggle-group" style="margin-top: 5px;">
                                <button id="bringToFront" class="mode-btn" title="Traer al Frente">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                                        style="margin-right: 6px;">
                                        <rect x="8" y="8" width="13" height="13" rx="2" />
                                        <path d="M4 14V6a2 2 0 0 1 2-2h8" />
                                    </svg>
                                    <span>Al frente</span>
                                </button>
                                <button id="sendToBack" class="mode-btn" title="Enviar al Fondo">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                                        style="margin-right: 6px;">
                                        <rect x="3" y="3" width="13" height="13" rx="2" />
                                        <path d="M16 10h2a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2v-2" />
                                    </svg>
                                    <span>Al fondo</span>
                                </button>
                            </div>
                        </div>

                        <div class="control-group-vertical">
                            <label>Invertir</label>
                            <div class="mode-toggle-group" style="margin-top: 5px;">
                                <button id="mirrorH" class="mode-btn" title="Espejo Horizontal">
                                    <div class="icon-small mirror-h"></div>
                                    <span>Horizontal</span>
                                </button>
                                <button id="mirrorV" class="mode-btn" title="Espejo Vertical">
                                    <div class="icon-small mirror-v"></div>
                                    <span>Vertical</span>
                                </button>
                            </div>
                        </div>

                        <div class="control-group-vertical">
                            <label>Rotar</label>
                            <div class="mode-toggle-group" style="margin-top: 5px;">
                                <button id="rotateL" class="mode-btn" title="Rotar 90° Izquierda">
                                    <div class="icon-small rotate-l"></div>
                                    <span>-90°</span>
                                </button>
                                <button id="rotateR" class="mode-btn" title="Rotar 90° Derecha">
                                    <div class="icon-small rotate-r"></div>
                                    <span>+90°</span>
                                </button>
                            </div>
                        </div>

                        <div class="control-group-vertical">
                            <label>Alinear</label>
                            <div class="control-row-label"
                                style="margin-top: 5px; font-size: 10px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.5px;">
                                Vertical</div>
                            <div class="mode-toggle-group three-cols" style="margin-top: 2px;">
                                <button id="alignLeft" class="mode-btn" title="Alinear a la Izquierda">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                                        style="margin-right: 4px;">
                                        <path d="M4 2v20" />
                                        <rect x="8" y="5" width="12" height="4" rx="1" />
                                        <rect x="8" y="15" width="8" height="4" rx="1" />
                                    </svg>
                                    <span>Izquierda</span>
                                </button>
                                <button id="alignCenterX" class="mode-btn" title="Alinear al Centro Vertical">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                                        style="margin-right: 4px;">
                                        <path d="M12 2v20" />
                                        <rect x="4" y="5" width="16" height="4" rx="1" />
                                        <rect x="6" y="15" width="12" height="4" rx="1" />
                                    </svg>
                                    <span>Centro</span>
                                </button>
                                <button id="alignRight" class="mode-btn" title="Alinear a la Derecha">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                                        style="margin-right: 4px;">
                                        <path d="M20 2v20" />
                                        <rect x="4" y="5" width="12" height="4" rx="1" />
                                        <rect x="8" y="15" width="8" height="4" rx="1" />
                                    </svg>
                                    <span>Derecha</span>
                                </button>
                            </div>
                            <div class="control-row-label"
                                style="margin-top: 8px; font-size: 10px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.5px;">
                                Horizontal</div>
                            <div class="mode-toggle-group three-cols" style="margin-top: 2px;">
                                <button id="alignTop" class="mode-btn" title="Alinear Arriba">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                                        style="margin-right: 4px;">
                                        <path d="M2 4h20" />
                                        <rect x="5" y="8" width="4" height="12" rx="1" />
                                        <rect x="15" y="8" width="4" height="8" rx="1" />
                                    </svg>
                                    <span>Arriba</span>
                                </button>
                                <button id="alignCenterY" class="mode-btn" title="Alinear al Medio Horizontal">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                                        style="margin-right: 4px;">
                                        <path d="M2 12h20" />
                                        <rect x="5" y="4" width="4" height="16" rx="1" />
                                        <rect x="15" y="6" width="4" height="12" rx="1" />
                                    </svg>
                                    <span>Centro</span>
                                </button>
                                <button id="alignBottom" class="mode-btn" title="Alinear Abajo">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                                        style="margin-right: 4px;">
                                        <path d="M2 20h20" />
                                        <rect x="5" y="4" width="4" height="12" rx="1" />
                                        <rect x="15" y="8" width="4" height="8" rx="1" />
                                    </svg>
                                    <span>Abajo</span>
                                </button>
                            </div>
                        </div>

                        <div class="control-group-vertical">
                            <label>Distribución</label>
                            <div class="mode-toggle-group" style="margin-top: 5px;">
                                <button id="distributeH" class="mode-btn" title="Distribuir Horizontalmente">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                                        style="margin-right: 4px;">
                                        <rect x="2" y="5" width="4" height="14" rx="1" />
                                        <rect x="18" y="5" width="4" height="14" rx="1" />
                                        <path d="M12 2v22M7 12h10" />
                                    </svg>
                                    <span>Horizontal</span>
                                </button>
                                <button id="distributeV" class="mode-btn" title="Distribuir Verticalmente">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                                        style="margin-right: 4px;">
                                        <rect x="5" y="2" width="14" height="4" rx="1" />
                                        <rect x="5" y="18" width="14" height="4" rx="1" />
                                        <path d="M2 12h22M12 7v10" />
                                    </svg>
                                    <span>Vertical</span>
                                </button>
                            </div>
                        </div>

                        <div class="control-group-vertical" style="margin-bottom: 0;">
                            <label>Escalar</label>
                            <div class="control-row" style="margin-top: 5px;">
                                <div class="control-group">
                                    <label>Ancho</label>
                                    <input type="text" id="targetScaleW" class="styled-input" value="---" disabled>
                                </div>
                                <div class="control-group">
                                    <label>Alto</label>
                                    <input type="text" id="targetScaleH" class="styled-input" value="---" disabled>
                                </div>
                            </div>
                            <button id="btnApplyScale" class="btn-small secondary-action"
                                style="margin-top: 5px;">APLICAR ESCALA</button>
                        </div>
                    </div>
